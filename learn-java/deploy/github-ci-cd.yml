name: Java Spring Boot Full-Stack CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'learn-java/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'learn-java/**'

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd learn-java/backend-spring
          mvn clean compile test-compile -B

  docker-build:
    name: Build Docker Container
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          cd learn-java
          docker build -t msts-spring-backend:latest -f deploy/Dockerfile .

