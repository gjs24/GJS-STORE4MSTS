spring:
  application:
    name: msts-store-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# ==========================================
# DEVELOPMENT PROFILE (Default: Zero Setup)
# ==========================================
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:msts_store_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

# ==========================================
# PRODUCTION PROFILE (PostgreSQL / Neon / AWS)
# ==========================================
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/msts_store}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

# ==========================================
# APPLICATION PROPERTIES & SECURITY
# ==========================================
---
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 604800000 # 7 days
  cashfree:
    app-id: ${CASHFREE_APP_ID:TEST_APP_ID}
    secret-key: ${CASHFREE_SECRET_KEY:TEST_SECRET_KEY}
    api-version: "2023-08-01"
    base-url: ${CASHFREE_BASE_URL:https://sandbox.cashfree.com/pg}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://gjs-store-4-msts.vercel.app}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Swagger / OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Management & Health Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

