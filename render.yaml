services:
  - type: web
    name: msts-gjs-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: PRIVATE_DOWNLOAD_BUCKET
        sync: false
      - key: PRIVATE_DOWNLOAD_REGION
        sync: false
      - key: PRIVATE_DOWNLOAD_ENDPOINT_URL
        sync: false
      - key: PRIVATE_DOWNLOAD_ACCESS_KEY_ID
        sync: false
      - key: PRIVATE_DOWNLOAD_SECRET_ACCESS_KEY
        sync: false
      - key: PRIVATE_DOWNLOAD_URL_EXPIRE_SECONDS
        value: "300"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
